server:
  port: ${PLATFORM_API_PORT:8080}
  address: ${PLATFORM_API_HOST:127.0.0.1}

spring:
  application:
    name: agent-crossing-platform-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

agent-crossing:
  storage-mode: ${STORAGE_MODE:memory}
  agent-runtime:
    base-url: ${AGENT_RUNTIME_BASE_URL:http://127.0.0.1:8090}
    http:
      connect-timeout: ${AGENT_RUNTIME_HTTP_CONNECT_TIMEOUT:3s}
      connection-request-timeout: ${AGENT_RUNTIME_HTTP_CONNECTION_REQUEST_TIMEOUT:2s}
      # Python provider default: 100s CLI timeout + up to 50s OpenCode export recovery.
      business-response-timeout: ${AGENT_RUNTIME_HTTP_BUSINESS_RESPONSE_TIMEOUT:180s}
      parser-response-timeout: ${AGENT_RUNTIME_HTTP_PARSER_RESPONSE_TIMEOUT:75s}
      max-connections: ${AGENT_RUNTIME_HTTP_MAX_CONNECTIONS:32}
      max-connections-per-route: ${AGENT_RUNTIME_HTTP_MAX_CONNECTIONS_PER_ROUTE:16}
  callback-base-url: ${PLATFORM_API_BASE_URL:http://127.0.0.1:8080}/api/callback
  default-agent-id: ${DEFAULT_AGENT_ID:opencode}
  realtime:
    sse-enabled: ${SSE_ENABLED:false}
  session-compression:
    enabled: ${SESSION_COMPRESSION_ENABLED:true}
    model: ${SESSION_COMPRESSION_MODEL:gpt-5.6}
    context-window-tokens: ${SESSION_COMPRESSION_CONTEXT_WINDOW_TOKENS:1000000}
    trigger-ratio: ${SESSION_COMPRESSION_TRIGGER_RATIO:0.8}
    keep-tail-user-turns: ${SESSION_COMPRESSION_KEEP_TAIL_USER_TURNS:3}
    max-tail-messages: ${SESSION_COMPRESSION_MAX_TAIL_MESSAGES:20}
    # Approximate 50k tokens using a conservative four characters per token.
    max-tail-characters: ${SESSION_COMPRESSION_MAX_TAIL_CHARACTERS:200000}
    summary-model: ${SESSION_COMPRESSION_SUMMARY_MODEL:gpt-5.6}
  agents:
    - agent-id: opencode
      display-name: OpenCode
      role: CLI coding agent for implementation, reasoning, and codebase operations.
      capabilities:
        - code reasoning
        - implementation
        - command-line execution
        - project analysis
      tools:
        - opencode-cli
        - filesystem
        - shell
    - agent-id: claudecode
      display-name: ClaudeCode
      role: CLI coding agent for complex reasoning, code review, and implementation.
      capabilities:
        - complex reasoning
        - code review
        - architecture analysis
        - implementation
        - command-line execution
      tools:
        - claude-code-cli
        - filesystem
        - shell
    - agent-id: codex
      display-name: Codex
      role: CLI coding agent for code reasoning, implementation, review, and repository analysis.
      capabilities:
        - code reasoning
        - implementation
        - code review
        - repository analysis
        - command-line execution
      tools:
        - codex-cli
        - filesystem
        - shell
